
services:
  jenkins:
    build: .
    container_name: jenkins-laravel

    ports:
      - "9090:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: heatalert-mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: heatalert_test
      MYSQL_USER: heatalert_ci
      MYSQL_PASSWORD: ci-local-only-change-me

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

volumes:
  jenkins_home:
  mysql_data:
