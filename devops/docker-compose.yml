# Jenkins + MySQL (CI) + SonarQube (+ Postgres)
# Ports hote : Jenkins 8082 | SonarQube 9000 | MySQL 3307
# (Prometheus 9090, Grafana 3000, cAdvisor 8081 -> monitoring/docker-compose.monitoring.yml)
#
# Reseau externe a creer UNE fois :  docker network create app-network

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-laravel
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # lancer docker depuis le pipeline
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - app-network        # pour que Prometheus voie jenkins-laravel:8080
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: heatalert-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: heatalert_test
      MYSQL_USER: heatalert_ci
      MYSQL_PASSWORD: ci-local-only-change-me
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  jenkins_home:
  mysql_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgresql_data:

networks:
  app-network:
    name: app-network
    external: true